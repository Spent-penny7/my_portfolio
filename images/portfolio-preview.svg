<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="50%" stop-color="#4ecdc4" />
      <stop offset="100%" stop-color="#ffe66d" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#codeGrad)" />

  <!-- Window Header -->
  <rect x="30" y="25" width="540" height="45" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" />
  <circle cx="55" cy="47" r="6" fill="#ef4444" />
  <circle cx="75" cy="47" r="6" fill="#f59e0b" />
  <circle cx="95" cy="47" r="6" fill="#10b981" />
  <text x="300" y="52" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#f43f5e" text-anchor="middle">⚡ Code_Mi • Modern Full-Stack Architecture</text>

  <!-- Left Code Editor Window -->
  <rect x="30" y="85" width="320" height="245" rx="10" fill="#0c0a09" stroke="rgba(255,255,255,0.08)" />
  <rect x="30" y="85" width="320" height="30" rx="10" fill="#1c1917" />
  <text x="50" y="105" font-family="monospace" font-size="11" fill="#a8a29e">app.service.ts</text>

  <!-- Syntax highlighted code lines -->
  <text x="50" y="140" font-family="monospace" font-size="11" fill="#f43f5e">const</text>
  <text x="90" y="140" font-family="monospace" font-size="11" fill="#38bdf8">portfolio</text>
  <text x="160" y="140" font-family="monospace" font-size="11" fill="#e2e8f0">= new Stack({</text>

  <text x="65" y="165" font-family="monospace" font-size="11" fill="#fbbf24">developer:</text>
  <text x="145" y="165" font-family="monospace" font-size="11" fill="#4ade80">'Njeze Mitchell'</text>
  <text x="255" y="165" font-family="monospace" font-size="11" fill="#e2e8f0">,</text>

  <text x="65" y="190" font-family="monospace" font-size="11" fill="#fbbf24">specialty:</text>
  <text x="145" y="190" font-family="monospace" font-size="11" fill="#4ade80">'Full Stack &amp; Mobile'</text>
  <text x="280" y="190" font-family="monospace" font-size="11" fill="#e2e8f0">,</text>

  <text x="65" y="215" font-family="monospace" font-size="11" fill="#fbbf24">coreStack:</text>
  <text x="145" y="215" font-family="monospace" font-size="11" fill="#e2e8f0">['React', 'Node.js', 'Firebase']</text>

  <text x="65" y="240" font-family="monospace" font-size="11" fill="#fbbf24">status:</text>
  <text x="125" y="240" font-family="monospace" font-size="11" fill="#38bdf8">'Open for Opportunities'</text>

  <text x="50" y="265" font-family="monospace" font-size="11" fill="#e2e8f0">});</text>

  <text x="50" y="295" font-family="monospace" font-size="11" fill="#f43f5e">export default</text>
  <text x="155" y="295" font-family="monospace" font-size="11" fill="#38bdf8">portfolio.deploy()</text>

  <!-- Right Visual Metrics -->
  <rect x="365" y="85" width="205" height="115" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
  <text x="385" y="112" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">PERFORMANCE SCORE</text>
  <text x="385" y="150" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="bold" fill="#4ade80">99 / 100</text>
  <rect x="385" y="165" width="165" height="8" rx="4" fill="#334155" />
  <rect x="385" y="165" width="163" height="8" rx="4" fill="#4ade80" />

  <rect x="365" y="215" width="205" height="115" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
  <text x="385" y="242" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">CODE METRICS</text>
  <text x="385" y="275" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">100% Responsive</text>
  <text x="385" y="300" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">Clean ES6+ Architecture</text>
</svg>
