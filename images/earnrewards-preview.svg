<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="earnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#earnBg)" />

  <!-- App Header -->
  <rect x="30" y="25" width="540" height="45" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" />
  <circle cx="55" cy="47" r="6" fill="#ef4444" />
  <circle cx="75" cy="47" r="6" fill="#f59e0b" />
  <circle cx="95" cy="47" r="6" fill="#10b981" />
  <text x="300" y="52" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#6ee7b7" text-anchor="middle">💰 EarnRewards • Digital Monetization &amp; Offers</text>

  <!-- Left Stats Card (Wallet Balance) -->
  <rect x="30" y="85" width="250" height="135" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.2)" />
  <text x="50" y="115" font-family="'Segoe UI', sans-serif" font-size="12" fill="#d1fae5" font-weight="600">TOTAL EARNED BALANCE</text>
  <text x="50" y="155" font-family="'Segoe UI', sans-serif" font-size="32" font-weight="bold" fill="#ffffff">$2,450.80</text>
  <rect x="50" y="172" width="100" height="24" rx="12" fill="rgba(0,0,0,0.2)" />
  <text x="100" y="188" font-family="'Segoe UI', sans-serif" font-size="11" fill="#ecfdf5" text-anchor="middle">⚡ +18.4% this week</text>

  <!-- Right Tasks Card -->
  <rect x="300" y="85" width="270" height="135" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" />
  <text x="320" y="115" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Active Sponsor Offers</text>
  
  <rect x="320" y="130" width="230" height="32" rx="6" fill="rgba(255,255,255,0.05)" />
  <circle cx="338" cy="146" r="8" fill="#f59e0b" />
  <text x="355" y="150" font-family="'Segoe UI', sans-serif" font-size="11" fill="#e2e8f0">App Install &amp; Survey</text>
  <text x="535" y="150" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#10b981" text-anchor="end">+150 pts</text>

  <rect x="320" y="172" width="230" height="32" rx="6" fill="rgba(255,255,255,0.05)" />
  <circle cx="338" cy="188" r="8" fill="#10b981" />
  <text x="355" y="192" font-family="'Segoe UI', sans-serif" font-size="11" fill="#e2e8f0">Sponsored Video Watch</text>
  <text x="535" y="192" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#10b981" text-anchor="end">+45 pts</text>

  <!-- Bottom Analytics / Payout Tracker -->
  <rect x="30" y="235" width="540" height="95" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
  <text x="50" y="260" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#a7f3d0">Instant Withdrawal Processing (Node.js &amp; Express API)</text>
  
  <!-- Step 1 -->
  <circle cx="80" cy="295" r="14" fill="#10b981" />
  <text x="80" y="299" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="105" y="298" font-family="'Segoe UI', sans-serif" font-size="11" fill="#e2e8f0">Offer Completed</text>
  
  <line x1="210" y1="295" x2="250" y2="295" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" />

  <!-- Step 2 -->
  <circle cx="275" cy="295" r="14" fill="#10b981" />
  <text x="275" y="299" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="300" y="298" font-family="'Segoe UI', sans-serif" font-size="11" fill="#e2e8f0">Points Converted</text>

  <line x1="410" y1="295" x2="445" y2="295" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,3" />

  <!-- Step 3 -->
  <circle cx="470" cy="295" r="14" fill="#f59e0b" />
  <text x="470" y="300" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">⚡</text>
  <text x="495" y="298" font-family="'Segoe UI', sans-serif" font-size="11" fill="#fde68a">Payout Sent</text>
</svg>
